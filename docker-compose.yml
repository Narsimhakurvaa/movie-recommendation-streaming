# ---------------------------------------------------------------------------
# Local stack: PostgreSQL + Redis + backend + frontend.
#
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose up --build
#
# The app is served at http://localhost:3000; nginx proxies /api to the
# backend, so the browser only ever talks to one origin.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cinevault}
      POSTGRES_USER: ${DATABASE_USERNAME:-cinevault}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cinevault}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      # Without this the backend races Postgres and Flyway fails on boot.
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-cinevault} -d ${DATABASE_NAME:-cinevault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Caching is a genuine optimisation here, never a source of truth, so an
    # in-memory-only Redis with no persistence is the correct trade-off.
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-cinevault}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-cinevault}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-cinevault}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "true"
      # No default: the app refuses to start without a real secret.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env - generate with openssl rand -base64 48}"
      MOVIE_PROVIDER: ${MOVIE_PROVIDER:-local}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
