spring:
  application:
    name: cinevault

  lifecycle:
    # Bounded drain window for in-flight requests during a rolling deploy.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cinevault}
    username: ${DATABASE_USERNAME:cinevault}
    password: ${DATABASE_PASSWORD:cinevault}
    hikari:
      # Sized for a modest instance. Connections are far more expensive than
      # threads, and an oversized pool mostly moves contention into the database.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: cinevault-pool

  jpa:
    open-in-view: false          # Fail loudly on missing fetch joins rather
                                 # than silently issuing queries during render.
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        # Surfaces accidental N+1 as a log warning during development.
        query:
          fail_on_pagination_over_collection_fetch: true
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
      connect-timeout: 2s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true              # Java 21 virtual threads: this workload is
                                 # I/O bound, so it benefits directly.

server:
  # Many Java hosts (Render, Railway, Heroku, Cloud Run) inject the port to
  # bind as $PORT. SERVER_PORT stays supported for local use and compose.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    # Errors are rendered by GlobalExceptionHandler; never leak internals.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
  shutdown: graceful

cinevault:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  cors:
    # Comma-separated. Never a wildcard: credentials are allowed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

  jwt:
    # No default. The application must not start with a hardcoded key.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:cinevault}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

  provider:
    # `local` uses the seeded catalogue and needs no credentials.
    type: ${MOVIE_PROVIDER:local}
    api-key: ${TMDB_API_KEY:}
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
    timeout: ${TMDB_TIMEOUT:PT5S}
    max-retries: 2

  cache:
    # `memory` keeps local startup dependency-free; `redis` for shared caching.
    type: ${CACHE_TYPE:memory}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-minutes: 1

  recommendation:
    # Films scored per request. Personalisation reorders the popularity head;
    # it does not rescue titles from the far tail, so this bound costs nothing.
    candidate-pool-size: ${RECOMMENDATION_POOL_SIZE:500}

  openapi:
    enabled: ${OPENAPI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # Only health and info are public (see SecurityConfiguration);
        # the rest require ROLE_ADMIN.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        # Liveness answers "is this process broken?". A database outage is not
        # a reason to restart the container - restarting fixes nothing and
        # causes a crash-loop - so the datasource is deliberately excluded.
        liveness:
          include: livenessState
        # Readiness answers "can this instance serve traffic?". Without the
        # database it cannot, so it should be pulled from the load balancer
        # while staying alive to recover.
        readiness:
          include: readinessState,db
  health:
    redis:
      # Redis is optional; a missing cache must not mark the app unhealthy.
      enabled: ${CACHE_TYPE_REDIS_HEALTH:false}
  info:
    env:
      enabled: false             # Prevents configuration leaking via /info.

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:true}
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.cinevault: ${LOG_LEVEL:INFO}
    # Deliberately quiet: these leak SQL and bind parameters at DEBUG.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
