server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep booting an old bundle
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The browser is not inside the Docker network, so it cannot reach the API
    # directly. nginx proxies it under the same origin, which also means no
    # CORS preflight in production.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter keys on the first hop of this header.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
